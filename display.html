<!DOCTYPE html>
<html>
<head>
<title>Display</title>

<style>
.block {
    display: block;
    background: rgb(254, 255, 254);
    margin: 10px;
    padding: 10px;
}

.inline {
    display: inline;
    background: rgb(176, 180, 181);
    padding: 5px;
}

.inline-block {
    display: inline-block;
    width: 120px;
    text-align: center;
    background: rgb(251, 253, 253);
    margin: 5px;
}
img {
    width: 100px;
}
</style>

</head>
<body>

<h2>Display Property</h2>

<span class="inline">Inline 1</span>
<div class="block">
  <img src="https://ln.run/La1wg">
</div>

<spanclass="inline">Inline 2</span>
<div class="inline-block">
   <img src="https://shorturl.at/gElx8">
</div>

</body>
</html>
