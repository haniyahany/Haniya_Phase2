<!DOCTYPE html>
<html>
<head>
<title>RR Academy - AI Courses</title>

<style>
body {
    background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
    font-family: Arial, sans-serif;
}

/* Title */
h1 {
    text-align: center;
    color: white;
    margin-top: 30px;
}

/* Container */
.card-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
}

/* Card */
.card {
    width: 300px;
    background: #111;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    color: white;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* Image */
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* Content */
.card h3 {
    margin: 15px;
    color: #00c6ff;
}

.card p {
    margin: 0 15px 15px;
    font-size: 14px;
}

/* Button */
.btn {
    display: block;
    margin: 15px;
    padding: 10px;
    text-align: center;
    background: #00c6ff;
    color: black;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>

<body>

<h1>RR Academy - AI Courses</h1>

<div class="card-container">

    <!-- Card 1 -->
    <div class="card">
        <img src="https://shorturl.at/nvAqY" alt="AI Image">
        <h3>Artificial Intelligence</h3>
        <p>Learn AI from basics to advanced with real-world projects.</p>
        <a href="#" class="btn">Enroll Now</a>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <img src="https://shorturl.at/YFJAG" alt="Robot">
        <h3>Machine Learnin</h3>
        <p>Bulid smart models and work with real datasets.</p>
        <a href="#" class="btn">Enroll Now</a>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <img src="https://lnk.ua/84zETr7mC" alt="AI Bot">
        <h3>Deep Learning</h3>
        <p>Explore neural networks and advanced AI technologies.</p>
        <a href="#" class="btn">Enroll Now</a>
    </div>

</div>

</body>
</html>
