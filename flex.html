<!DOCTYPE html>
<html>
<head>
<title>Flexbox</title>

<style>
.container {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: rgb(120, 185, 194);
}

.box {
    width: 150px;
    text-align: center;
}

.box img {
    width: 100%;
}
</style>

</head>
<body>

<h2>Flex Layout</h2>

<div class="container">
    <div class="box">
        <img src="https://shorturl.at/wcSbH">
        <p>AI</p>
    </div>

    <div class="box">
        <img src="https://shorturl.at/JbMrM">
        <p>Robot</p>
    </div>

    <div class="box">
        <img src="https://shorturl.at/PUdzu">
        <p>Deep AI</p>
    </div>
</div>

</body>
</html>
